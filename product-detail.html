<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Product Details</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="container navbar">
        <h1 class="logo">ShopEase</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </div>
</header>

<main class="container">

    <section class="product-detail">

        <div>
            <img src="https://via.placeholder.com/500"
                 alt="Wireless Headphones"
                 class="detail-image">
        </div>

        <div class="detail-info">
            <h2>Wireless Headphones</h2>

            <p class="price">₹1,499</p>

            <p>
                Enjoy high-quality sound with these comfortable
                wireless headphones. Perfect for music, movies
                and online classes.
            </p>

            <label for="quantity">Quantity:</label>

            <input type="number"
                   id="quantity"
                   name="quantity"
                   value="1"
                   min="1">

            <br><br>

            <button class="btn">Add to Cart</button>
        </div>

    </section>

</main>

<footer>
    <p>Contact: support@shopease.com | Phone: +91 98765 43210</p>
    <p>&copy; 2026 ShopEase. All Rights Reserved.</p>
</footer>

</body>
</html>
