<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="container navbar">
        <h1 class="logo">ShopEase</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart <span id="cart-count" class="cart-count">0</span></a>
        </nav>
    </div>
</header>
<main class="container">
    <h2 class="section-title">Checkout</h2>
    <form id="checkout-form" class="checkout-form" novalidate>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
        <small id="name-error" class="form-error"></small>
        <label for="address">Address</label>
        <input type="text" id="address" name="address" required>
        <small id="address-error" class="form-error"></small>
        <label for="city">City</label>
        <input type="text" id="city" name="city" required>
        <label for="pincode">Pincode</label>
        <input type="text" id="pincode" name="pincode" required>
        <small id="pincode-error" class="form-error"></small>
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" required>
        <small id="phone-error" class="form-error"></small>
        <fieldset>
            <legend>Payment Method</legend>
            <label>
                <input type="radio"
                       name="payment"
                       value="cod"
                       required>
                Cash on Delivery
            </label>
            <label>
                <input type="radio"
                       name="payment"
                       value="upi">
                UPI
            </label>
            <label>
                <input type="radio"
                       name="payment"
                       value="card">
                Credit/Debit Card
            </label>
        </fieldset>
        <button type="submit" class="btn">
            Place Order
        </button>
        <p id="order-confirmation" class="order-confirmation" role="status"></p>
    </form>
</main>
<footer>
    <p>Contact: support@shopease.com | Phone: +91 98765 43210</p>
    <p>&copy; 2026 ShopEase. All Rights Reserved.</p>
</footer>
<script src="script.js"></script>
</body>
</html>
