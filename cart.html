<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="container navbar">
        <h1 class="logo">ShopEase</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </div>
</header>
<main class="container">

  <h2 class="section-title">Shopping Cart</h2>
    <div class="cart-container">
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Subtotal</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Wireless Headphones</td>
                    <td>1</td>
                    <td>₹1,499</td>
                    <td>₹1,499</td>
                </tr>

                <tr>
                    <td>Smart Watch</td>
                    <td>1</td>
                    <td>₹2,499</td>
                    <td>₹2,499</td>
                </tr>

                <tr class="total-row">
                    <td colspan="3"><strong>Grand Total</strong></td>
                    <td><strong>₹3,998</strong></td>
                </tr>

            </tbody>

        </table>

        <a href="checkout.html" class="btn checkout-btn">
            Proceed to Checkout
        </a>
    </div>
</main>
<footer>
    <p>Contact: support@shopease.com | Phone: +91 98765 43210</p>
    <p>&copy; 2026 ShopEase. All Rights Reserved.</p>
</footer>
</body>
</html>
