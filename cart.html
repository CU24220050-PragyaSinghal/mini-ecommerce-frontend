<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="container navbar">
        <h1 class="logo">ShopEase</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart <span id="cart-count" class="cart-count">0</span></a>
        </nav>
    </div>
</header>
<main class="container">

  <h2 class="section-title">Shopping Cart</h2>
    <div id="cart-container" class="cart-container">
        <p id="empty-cart" class="empty-cart" style="display: none;">Your cart is empty.</p>
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="cart-items">
                <tr class="total-row">
                    <td colspan="3"><strong>Grand Total</strong></td>
                    <td><strong id="grand-total">₹0</strong></td>
                </tr>

            </tbody>

        </table>

        <a href="checkout.html" class="btn checkout-btn">
            Proceed to Checkout
        </a>
    </div>
</main>
<footer>
    <p>Contact: support@shopease.com | Phone: +91 98765 43210</p>
    <p>&copy; 2026 ShopEase. All Rights Reserved.</p>
</footer>
<script src="script.js"></script>
</body>
</html>
